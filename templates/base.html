<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Diagnóstico Médico{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .compact-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            padding: 0.5rem 0;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #0d6efd;
            text-decoration: none;
        }
        .header-brand:hover {
            color: #0a58ca;
        }
        .header-title {
            font-size: 1.25rem;
            margin: 0;
            line-height: 1.2;
        }
        .header-subtitle {
            font-size: 0.875rem;
            color: #6c757d;
            margin: 0;
        }
        .nav-compact {
            padding: 0;
            margin-top: 0.5rem;
        }
        .nav-compact .nav-link {
            padding: 0.5rem 1rem;
        }
        .main-container {
            padding-top: 1rem;
        }
        @media (min-width: 768px) {
            .header-content {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .nav-compact {
                margin-top: 0;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Cabeçalho Compacto -->
    <header class="compact-header">
        <div class="container">
            <div class="header-content">
                <a href="/" class="header-brand">
                    <i class="fas fa-heartbeat fa-lg"></i>
                    <div>
                        <h1 class="header-title">DiagMed</h1>
                        <p class="header-subtitle">Sistema de Diagnóstico Médico</p>
                    </div>
                </a>
                
                <!-- Menu de Navegação Compacto -->
                <nav>
                    <ul class="nav nav-pills nav-compact">
                        <li class="nav-item">
                            <a class="nav-link active" href="#diagnostic">
                                <i class="fas fa-stethoscope"></i>
                                <span class="d-none d-sm-inline ms-1">Diagnóstico</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#patients">
                                <i class="fas fa-users"></i>
                                <span class="d-none d-sm-inline ms-1">Pacientes</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#history">
                                <i class="fas fa-history"></i>
                                <span class="d-none d-sm-inline ms-1">Histórico</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#stats">
                                <i class="fas fa-chart-bar"></i>
                                <span class="d-none d-sm-inline ms-1">Estatísticas</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-container">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
